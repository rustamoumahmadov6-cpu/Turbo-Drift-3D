<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Ace 3D - Ultimate Edition</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 15px;
            color: #ddd;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #gameover-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }
        #gameover-screen h1 {
            color: #ff4757;
            font-size: 50px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
        }
        #gameover-screen p {
            font-size: 22px;
            margin-bottom: 25px;
        }
        .btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
        }
        .btn:hover {
            background: #26af5f;
            transform: scale(1.05);
        }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="ui">
        ✈️ Имтиёз: <span id="score">0</span> | ❤️ Ҷонҳо: <span id="lives">3</span>
    </div>

    <div id="controls-hint">
        Идоракунӣ: Тугмаҳои <b>W, A, S, D</b> ё <b>Стрелкаҳо</b> | Боло/Поён/Чап/Рост
    </div>

    <div id="gameover-screen">
        <h1>БОЗӢ ТАМОМ ШУД</h1>
        <p>Имтиёзи ниҳоии шумо: <span id="final-score">0</span></p>
        <button class="btn" onclick="restartGame()">Аз нав оғоз кардан</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Тағйирёбии ҳолати бозӣ
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let gameSpeed = 0.8;

        // Саҳна, Камера ва Рендерер
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x70b5ff);
        scene.fog = new THREE.FogExp2(0x70b5ff, 0.01);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Рушноӣ (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Замин (Ground)
        const groundGeo = new THREE.PlaneGeometry(1000, 2000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x38b000, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -20;
        scene.add(ground);

        // Сохтани Самолёт (Airplane)
        const airplane = new THREE.Group();

        // Тана
        const bodyGeo = new THREE.ConeGeometry(0.9, 4.5, 8);
        bodyGeo.rotateX(Math.PI / 2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3838, metalness: 0.2 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        airplane.add(body);

        // Болҳо
        const wingGeo = new THREE.BoxGeometry(7, 0.12, 1.5);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        wings.position.set(0, 0, 0.2);
        airplane.add(wings);

        // Дум
        const tailGeo = new THREE.BoxGeometry(0.12, 1.2, 1.2);
        const tail = new THREE.Mesh(tailGeo, wingMat);
        tail.position.set(0, 0.6, -1.8);
        airplane.add(tail);

        // Пропеллер
        const propGeo = new THREE.BoxGeometry(2.2, 0.3, 0.08);
        const propMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const propeller = new THREE.Mesh(propGeo, propMat);
        propeller.position.set(0, 0, 2.3);
        airplane.add(propeller);

        scene.add(airplane);
        airplane.position.set(0, 2, 0);

        // Гурӯҳи монеаҳо ва тангаҳо
        const obstacles = [];
        const coins = [];

        // Функсияи сохтани монеаҳо (Кӯҳҳои бархӯрд)
        function createObstacles() {
            for (let i = 0; i < 50; i++) {
                const width = 6 + Math.random() * 8;
                const height = 15 + Math.random() * 20;
                const depth = 6 + Math.random() * 8;

                const obsGeo = new THREE.BoxGeometry(width, height, depth);
                const obsMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
                const obstacle = new THREE.Mesh(obsGeo, obsMat);

                const posX = (Math.random() - 0.5) * 120;
                const posY = -20 + height / 2;
                const posZ = -i * 60 - 50;

                obstacle.position.set(posX, posY, posZ);
                scene.add(obstacle);
                obstacles.push(obstacle);

                // Дар паҳлӯи баъзе монеаҳо танга мегузорем
                if (Math.random() > 0.4) {
                    const coinGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.3, 16);
                    coinGeo.rotateZ(Math.PI / 2);
                    const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
                    const coin = new THREE.Mesh(coinGeo, coinMat);
                    coin.position.set(posX + (Math.random() > 0.5 ? 6 : -6), posY + 2, posZ);
                    scene.add(coin);
                    coins.push(coin);
                }
            }
        }
        createObstacles();

        // Идоракунӣ бо клавиатура
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Ҳаракати асосии бозӣ (Animation Loop)
        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // Чарх задани пропеллер
            propeller.rotation.z += 0.5;

            // Идоракунии самолёт
            if (keys['w'] || keys['arrowup']) airplane.position.y += 0.3;
            if (keys['s'] || keys['arrowdown']) airplane.position.y -= 0.3;

            if (keys['a'] || keys['arrowleft']) {
                airplane.rotation.z += 0.04;
                airplane.position.x -= 0.4;
            } else if (keys['d'] || keys['arrowright']) {
                airplane.rotation.z -= 0.04;
                airplane.position.x += 0.4;
            } else {
                airplane.rotation.z *= 0.9; // Баргаштан ба ҳолати устувор
            }

            // Маҳдудияти ҳудуди ҳаракат дар паҳлӯҳо
            if (airplane.position.x < -60) airplane.position.x = -60;
            if (airplane.position.x > 60) airplane.position.x = 60;
            if (airplane.position.y < -15) airplane.position.y = -15;
            if (airplane.position.y > 50) airplane.position.y = 50;

            // Ҳаракати доимии самолёт ба пеш
            airplane.position.z -= gameSpeed;
            score += 1;
            document.getElementById('score').innerText = Math.floor(score / 10);

            // Суръати бозӣ оҳиста-оҳиста зиёд мешавад
            gameSpeed += 0.0001;

            // Санҷиши бархӯрд бо монеаҳо
            obstacles.forEach(obs => {
                const distance = airplane.position.distanceTo(obs.position);
                if (distance < 5.5) {
                    lives -= 1;
                    document.getElementById('lives').innerText = lives;
                    // Дуртар бурдани монеа пас аз бархӯрд то такрор нашавад
                    obs.position.z -= 300; 

                    if (lives <= 0) {
                        triggerGameOver();
                    }
                }
            });

            // Санҷиши гирифтани тангаҳо
            coins.forEach((coin, index) => {
                coin.rotation.y += 0.05; // Чарх задани танга
                const distance = airplane.position.distanceTo(coin.position);
                if (distance < 3.5) {
                    score += 500; // Имтиёзи иловагӣ
                    scene.remove(coin);
                    coins.splice(index, 1);
                }
            });

            // Камера аз қафо пайравӣ мекунад
            camera.position.x = airplane.position.x;
            camera.position.y = airplane.position.y + 4;
            camera.position.z = airplane.position.z + 12;
            camera.lookAt(airplane.position.x, airplane.position.y, airplane.position.z - 10);

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = Math.floor(score / 10);
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            lives = 3;
            gameSpeed = 0.8;
            airplane.position.set(0, 2, 0);
            document.getElementById('lives').innerText = lives;
            document.getElementById('gameover-screen').style.display = 'none';
            animate();
        }

        // Оғози бозӣ
        animate();

        // Мутобиқсозии андозаи экран
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
